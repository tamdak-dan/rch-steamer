# RCH Steamer HMI settings for this Raspberry Pi.
# Lives at /etc/rch-steamer.conf on the Pi. install.sh fills it in from its
# options; you can also edit it by hand (see deploy/UPDATING.md).
# Format: NAME=value, no spaces around "=".

# --- This Pi on the machine network --------------------------------------
PI_IP=192.168.137.20
PI_PREFIX=24            # 24 = subnet mask 255.255.255.0
PI_GATEWAY=             # usually blank on an isolated machine network

# --- The CX7000 PLC ----------------------------------------------------------
RCH_PLC_IP=192.168.137.6
RCH_PLC_AMS_NETID=5.177.96.78.1.1

# The Pi's own AMS Net ID. Leave blank to use PI_IP + ".1.1", which is what
# the route on the PLC must point to.
RCH_LOCAL_AMS_NETID=

# --- Screen -----------------------------------------------------------------
# Rotate the picture: 0, 90, 180 or 270 degrees clockwise.
SCREEN_ROTATE=0

# Touchscreen chip: "none" (USB/HDMI touch, works by itself) or "xpt2046"
# (Waveshare resistive touch wired to the GPIO pins; needs a driver).
TOUCH=none

# Rotation applied to touch, degrees clockwise. Blank = same as the screen.
# If taps land in the wrong place, try other values (0, 90, 180, 270).
TOUCH_ROTATE=

# --- SD card protection ------------------------------------------------------
# yes = SD card is read-only while running (protects against power cuts).
# The USB updater unlocks it, installs, and locks it again automatically.
LOCK_SD=yes
